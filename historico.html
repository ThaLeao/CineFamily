<body>

<header>

</header>

<main>

```
<section class="categoria-secao">


    <h1>
        🕘 Histórico
    </h1>


    <button id="limpar-historico">

        🗑️ Limpar histórico

    </button>


    <br><br>


    <div
        id="lista-historico"
        class="cards">
    </div>


    <p
        id="nenhum-historico"
        style="display: none;">

        Você ainda não assistiu a nenhum filme.

    </p>


</section>
```

</main>

<script>


const IMG =
    "https://image.tmdb.org/t/p/w500";



function carregarHistorico() {


    const lista =
        document.getElementById(
            "lista-historico"
        );


    const mensagem =
        document.getElementById(
            "nenhum-historico"
        );


    if (!lista || !mensagem) {

        console.error(
            "Elementos do histórico não encontrados."
        );

        return;

    }


    const historico =
        JSON.parse(
            localStorage.getItem(
                "cinefamilyHistorico"
            )
        ) || [];


    console.log(
        "HISTÓRICO:",
        historico
    );


    lista.innerHTML = "";


    if (historico.length === 0) {

        mensagem.style.display =
            "block";

        return;

    }


    mensagem.style.display =
        "none";


    historico.forEach(
        function(filme) {


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "card";


            const imagem =
                filme.poster_path
                    ? IMG + filme.poster_path
                    : "";


            card.innerHTML = `

                <div class="imagem-card">

                    ${
                        imagem
                        ? `<img
                            src="${imagem}"
                            alt="${filme.title || "Filme"}"
                          >`
                        : "🎬"
                    }

                </div>


                <h3>
                    ${filme.title || "Sem título"}
                </h3>


                <p>
                    ⭐ ${
                        filme.vote_average
                        ? Number(
                            filme.vote_average
                          ).toFixed(1)
                        : "N/A"
                    }
                </p>

            `;


            lista.appendChild(card);


        }
    );


}



function limparHistorico() {


    localStorage.removeItem(
        "cinefamilyHistorico"
    );


    carregarHistorico();


}



document.addEventListener(
    "DOMContentLoaded",
    carregarHistorico
);



const botao =
    document.getElementById(
        "limpar-historico"
    );


if (botao) {

    botao.addEventListener(
        "click",
        limparHistorico
    );

}


</script>

</body>

</html>
