<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Histórico - CineFamily</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <div class="logo">
        CineFamily
    </div>

    <nav>
        <a href="index.html">Início</a>
        <a href="index.html">Filmes</a>
        <a href="favoritos.html">⭐ Favoritos</a>
        <a href="historico.html">🕘 Histórico</a>
    </nav>

</header>

<main>

    <section class="categoria-secao">

        <h1>🕘 Histórico</h1>

        <button id="limpar-historico">
            🗑️ Limpar histórico
        </button>

        <br><br>

        <div id="lista-historico" class="cards"></div>

        <p id="nenhum-historico">
            Você ainda não assistiu a nenhum filme.
        </p>

    </section>

</main>

<script>

const IMG = "https://image.tmdb.org/t/p/w500";

function carregarHistorico() {

    const lista = document.getElementById("lista-historico");
    const mensagem = document.getElementById("nenhum-historico");

    const historico = JSON.parse(
        localStorage.getItem("cinefamilyHistorico")
    ) || [];

    console.log("HISTÓRICO:", historico);

    if (historico.length === 0) {
        mensagem.style.display = "block";
        return;
    }

    mensagem.style.display = "none";

    historico.forEach(function(filme) {

        const card = document.createElement("div");

        card.className = "card";

        const imagem = filme.poster_path
            ? IMG + filme.poster_path
            : "";

        card.innerHTML = `

            <div class="imagem-card">

                ${
                    imagem
                    ? `<img src="${imagem}" alt="${filme.title}">`
                    : "🎬"
                }

            </div>

            <h3>${filme.title}</h3>

            <p>
                ⭐ ${Number(filme.vote_average).toFixed(1)}
            </p>

        `;

        lista.appendChild(card);

    });

}

function limparHistorico() {

    localStorage.removeItem("cinefamilyHistorico");

    carregarHistorico();

}

document.addEventListener(
    "DOMContentLoaded",
    carregarHistorico
);

document.getElementById(
    "limpar-historico"
).addEventListener(
    "click",
    limparHistorico
);

</script>

</body>
</html>
