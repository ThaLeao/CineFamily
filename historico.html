<!DOCTYPE html>

<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

<title>Histórico - CineFamily</title>

<link
    rel="stylesheet"
    href="style.css">

</head>

<body>

<header>

<div class="logo">
    CineFamily
</div>

<nav>

    <a href="index.html">
        Início
    </a>

    <a href="index.html">
        Filmes
    </a>

    <a href="favoritos.html">
        ⭐ Favoritos
    </a>

    <a href="historico.html">
        🕘 Histórico
    </a>

</nav>

<div class="acoes">

    <span>🔎</span>

    <a
        href="favoritos.html"
        title="Meus favoritos">
        ⭐
    </a>

    <a
        href="historico.html"
        title="Meu histórico">
        🕘
    </a>

    <span>👤</span>

</div>

</header>

<main>

<section class="categoria-secao">

    <div
        style="
            display:flex;
            justify-content:space-between;
            align-items:center;
            gap:20px;
            flex-wrap:wrap;
        ">

        <h1>
            🕘 Meu Histórico
        </h1>

        <button
            id="limpar-historico"
            type="button">

            🗑️ Limpar histórico

        </button>

    </div>


    <div
        id="lista-historico"
        class="cards">

    </div>


    <p
        id="nenhum-historico"
        style="display:none;">

        Você ainda não abriu nenhum filme.

    </p>

</section>

</main>

<script> const IMG = "https://image.tmdb.org/t/p/w500"; // ================================================== // CARREGAR HISTÓRICO // ================================================== function carregarHistorico() { const lista = document.getElementById( "lista-historico" ); const mensagem = document.getElementById( "nenhum-historico" ); let historico = []; try { historico = JSON.parse( localStorage.getItem( "cinefamilyHistorico" ) ) || []; } catch (erro) { console.error( "Erro ao ler histórico:", erro ); historico = []; } console.log( "CineFamily - Histórico encontrado:", historico ); lista.innerHTML = ""; if (!historico.length) { mensagem.style.display = "block"; return; } mensagem.style.display = "none"; historico.forEach(filme => { const card = document.createElement( "div" ); card.className = "card"; const imagem = filme.poster_path ? `${IMG}${filme.poster_path}` : ""; let dataTexto = ""; if (filme.dataVisualizacao) { try { const data = new Date( filme.dataVisualizacao ); dataTexto = data.toLocaleString( "pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" } ); } catch (erro) { dataTexto = ""; } } card.innerHTML = ` <div class="imagem-card"> ${ imagem ? `<img src="${imagem}" alt="${filme.title || "Filme"}">` : "🎬" } </div> <h3> ${filme.title || "Sem título"} </h3> <p> ⭐ ${ filme.vote_average ? Number( filme.vote_average ).toFixed(1) : "N/A" } </p> ${ dataTexto ? `<p> 🕘 ${dataTexto} </p>` : "" } `; lista.appendChild(card); }); } // ================================================== // LIMPAR HISTÓRICO // ================================================== function limparHistorico() { localStorage.removeItem( "cinefamilyHistorico" ); carregarHistorico(); } // ================================================== // BOTÃO LIMPAR // ================================================== document .getElementById( "limpar-historico" ) .addEventListener( "click", () => { const confirmar = confirm( "Tem certeza que deseja limpar todo o histórico?" ); if (confirmar) { limparHistorico(); } } ); // ================================================== // INICIAR // ================================================== carregarHistorico(); </script>

</body>

</html>
